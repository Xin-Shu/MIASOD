# YOLOv11-L coarse pass: the whole frame resized to a longer side of 1,024 px.
# Trained on whole frames and density crops (DMNet recipe); the same weights detect on the crops of crop mode.
executor: yolov11
weights: weights/yolov11l_coarse1024.pt
imgsz: 1024
conf: 0.001
max_det: 300
half: false
batch: 1
device: 0
